<body>

<div class="viewer">
  <button class="vbtn" id="prev" aria-label="Previous photo">‹</button>
  <div class="vstage">
    <img id="vimg" src="assets/img/live-01.jpg" alt="DJ Holly Weed live">
    <div class="vmeta">
      <span class="vcount" id="vcount">1 / 14</span>
      <span class="vcap" id="vcap">Southwest Flow Festival 2026 — one of three one-hour sets</span>
    </div>
  </div>
  <button class="vbtn" id="next" aria-label="Next photo">›</button>
</div>

<div class="filmstrip" id="strip"></div>

</div>

<script>
var PHOTOS = [
  ["live-01.jpg","Southwest Flow Festival 2026 — one of three one-hour sets"],
  ["live-02.jpg","Southwest Flow Festival 2026"],
  ["live-03.jpg","Southwest Flow Festival 2026"],
  ["live-04.jpg","Southwest Flow Festival 2026"],
  ["live-05.jpg","Southwest Flow Festival 2026"],
  ["live-06.jpg","Southwest Flow Festival 2026"],
  ["live-07.jpg","Southwest Flow Festival 2026"],
  ["live-08.jpg","Southwest Flow Festival 2026"],
  ["live-09.jpg","Behind the decks — Las Vegas"],
  ["live-10.jpg","Las Vegas"],
  ["live-11.jpg","Las Vegas"],
  ["live-12.jpg","Las Vegas"],
  ["live-13.jpg","Las Vegas"],
  ["live-14.jpg","On camera — Las Vegas"]
];
var i = 0, img = document.getElementById('vimg'), cap = document.getElementById('vcap'),
    cnt = document.getElementById('vcount'), strip = document.getElementById('strip');
PHOTOS.forEach(function(p, k){
  var t = document.createElement('img');
  t.src = 'assets/img/' + p[0]; t.alt = p[1];
  t.addEventListener('click', function(){ show(k); });
  strip.appendChild(t);
});
function show(k){
  i = (k + PHOTOS.length) % PHOTOS.length;
  img.src = 'assets/img/' + PHOTOS[i][0];
  img.alt = cap.textContent = PHOTOS[i][1];
  cnt.textContent = (i+1) + ' / ' + PHOTOS.length;
  var ts = strip.children;
  for (var j = 0; j < ts.length; j++) ts[j].className = (j === i) ? 'on' : '';
  ts[i].scrollIntoView({block:'nearest', inline:'nearest'});
}
document.getElementById('prev').addEventListener('click', function(){ show(i-1); });
document.getElementById('next').addEventListener('click', function(){ show(i+1); });
document.addEventListener('keydown', function(e){
  if (e.key === 'ArrowLeft') show(i-1);
  if (e.key === 'ArrowRight') show(i+1);
});
show(0);
PHOTOS.forEach(function(p){ (new Image()).src = 'assets/img/' + p[0]; });
</script>
</body>
</html>
